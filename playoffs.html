<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#008e97"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon.png"><title>Miami Dolphins · Playoffs</title><style>
:root{--teal:#008e97;--deep:#006a72;--bg:#f2f6f6;--ink:#102629;--muted:#6a7b7e;--line:#dce5e5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:linear-gradient(135deg,#005c64,#008e97,#00a5aa);color:#fff;box-shadow:0 5px 18px #003f4330}.container{width:min(1080px,calc(100% - 24px));margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0 10px}.brand{display:flex;align-items:center;gap:11px}.brand img{width:62px;height:62px;object-fit:contain}.title{font-size:25px;font-weight:950}.subtitle{font-size:12px;opacity:.9}.season{position:relative;background:#ffffff18;color:#fff;border:1px solid #ffffff80;border-radius:11px;padding:10px 12px;font-weight:800}.season:after{content:"⌄";position:absolute;right:14px;top:50%;transform:translateY(-55%);pointer-events:none}.season select{appearance:none;background:transparent;color:#fff;border:0;outline:0;font:inherit;font-weight:800;font-size:inherit;padding-right:18px;cursor:pointer}.season option{color:#102629;background:#fff}.nav{display:flex;border-top:1px solid #ffffff25}.nav a{flex:1;text-align:center;color:#fff;text-decoration:none;font-size:12px;font-weight:900;padding:11px 3px}.nav a.active{background:#ffffff16;border-bottom:3px solid #fff}main{padding:16px 0 30px}.summary,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px 16px}.summary h1{margin:0 0 5px;font-size:22px}.summary p{margin:0;color:var(--muted);font-size:12px}.bracket-note{margin-top:12px;padding:13px;border-radius:12px;background:#eef7f7;border:1px solid #d3e8e8;color:#36595c;font-size:12px;line-height:1.5}.bracket-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.conf{background:#f8fbfb;border:1px solid var(--line);border-radius:14px;padding:12px;overflow:hidden}.conf h2{margin:0 0 10px;color:var(--deep);font-size:18px}.rounds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.round{min-width:0}.round h3{font-size:10px;color:var(--muted);margin:0 0 7px}.bracket-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px;margin-bottom:9px;box-shadow:0 2px 7px #123b3d08}.bracket-title{font-size:9px;font-weight:900;color:var(--muted);margin-bottom:5px}.bteam{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 2px;border-bottom:1px solid #edf1f1;min-height:38px}.bteam:last-of-type{border-bottom:0}.bname{display:flex;align-items:center;gap:6px;min-width:0}.bname img{width:28px!important;height:28px!important;max-width:28px!important;max-height:28px!important;object-fit:contain!important;flex:none}.bname span{font-size:10px;line-height:1.12;min-width:0}.bname small{display:inline-block;color:var(--muted);font-weight:900;margin-right:4px}.bteam>b{font-size:13px;flex:none}.winner{font-weight:950;background:#f5fbfb}.btbd{display:flex;align-items:center;min-height:38px;padding:5px 2px;border-bottom:1px solid #edf1f1;font-size:10px;color:#879698}.status{text-align:right;font-size:8px;font-weight:900;color:#8a999b;padding-top:5px}.status.open{color:var(--teal)}.superbowl{margin-top:14px;background:linear-gradient(135deg,#fff,#eef8f8);border:1px solid #cde4e5;border-radius:15px;padding:14px;text-align:center}.super-title{font-weight:950;color:var(--deep);font-size:17px}.sb-match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:10px;font-weight:900}.sb-team{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px}.sb-team img{width:32px!important;height:32px!important;object-fit:contain!important}.sb-team b{font-size:18px}.superbowl small{display:block;color:var(--muted);margin-top:7px}footer{padding:0 0 28px;color:var(--muted);font-size:10px}@media(max-width:760px){.bracket-wrap{grid-template-columns:1fr;gap:12px}.rounds{display:grid;grid-template-columns:1fr;gap:14px;overflow:visible}.conf{overflow:visible;padding:11px}.round{width:100%}.round h3{font-size:11px;margin-bottom:6px}.bracket-card{width:100%;margin-bottom:8px;padding:8px}.bteam{min-height:44px;padding:6px 3px}.bname img{width:30px!important;height:30px!important;max-width:30px!important;max-height:30px!important}.bname span{font-size:11px}.bteam>b{font-size:15px}.status{font-size:9px}.brand img{width:52px;height:52px}.title{font-size:21px}.sb-match{grid-template-columns:1fr;gap:7px}.sb-match>strong{font-size:12px}.sb-team{min-height:54px;padding:8px 10px}.sb-team img{width:34px!important;height:34px!important}.sb-team b{font-size:16px}}@media(max-width:520px){.container{width:calc(100% - 14px)}.top{gap:8px}.season{font-size:12px;padding:8px}.nav a{font-size:10px}.summary h1{font-size:20px}.conf h2{font-size:18px}.rounds{grid-template-columns:1fr}.bname span{font-size:11px}.sb-team b{font-size:15px}}
</style></head><body><header><div class="container"><div class="top"><div class="brand"><img src="https://static.www.nfl.com/league/api/clubs/logos/MIA.svg" alt="Miami Dolphins Logo"><div><div class="title">MIAMI DOLPHINS</div><div class="subtitle">SEASON HUB</div></div></div><div class="season"><select id="seasonSelect" aria-label="Saison auswählen"><option value="2026">Saison 2026</option><option value="2025">Saison 2025</option><option value="2024">Saison 2024</option></select></div></div><nav class="nav"><a href="index.html">📅 SPIELPLAN</a><a href="tabelle.html">🏆 TABELLE</a><a class="active" href="playoffs.html">🏈 PLAYOFFS</a></nav></div></header><main class="container"><section class="summary"><h1>🏈 PLAYOFFS</h1><p><span id="yearTitle">2026</span> NFL Playoffs</p></section><section class="panel" style="margin-top:12px"><div id="playoffBox"></div></section></main><footer class="container">Private Miami Dolphins Season Hub · <span id="footerYear">2026</span></footer><script>
const LOGO='https://static.www.nfl.com/league/api/clubs/logos/';
const ESPN='https://a.espncdn.com/i/teamlogos/nfl/500/';
const NAME={MIA:'Miami Dolphins',BUF:'Buffalo Bills',NE:'New England Patriots',NYJ:'New York Jets',BAL:'Baltimore Ravens',CIN:'Cincinnati Bengals',PIT:'Pittsburgh Steelers',HOU:'Houston Texans',DEN:'Denver Broncos',KC:'Kansas City Chiefs',LAC:'Los Angeles Chargers',JAX:'Jacksonville Jaguars',SEA:'Seattle Seahawks',SF:'San Francisco 49ers',PHI:'Philadelphia Eagles',GB:'Green Bay Packers',CHI:'Chicago Bears',DET:'Detroit Lions',WAS:'Washington Commanders',TB:'Tampa Bay Buccaneers',MIN:'Minnesota Vikings',LAR:'Los Angeles Rams',CAR:'Carolina Panthers'};
const DATA={
2024:{sb:'Super Bowl LIX',champ:'PHI',afc:{wild:[['HOU','LAC',32,12,4,5],['BAL','PIT',28,14,3,6],['BUF','DEN',31,7,2,7]],div:[['KC','HOU',23,14,1,4],['BUF','BAL',27,25,2,3]],conf:[['KC','BUF',32,29,1,2]]},nfc:{wild:[['PHI','GB',22,10,2,7],['TB','WAS',20,23,4,6],['LAR','MIN',27,9,4,5]],div:[['DET','WAS',31,45,1,6],['PHI','LAR',28,22,2,4]],conf:[['PHI','WAS',55,23,2,6]]},sb:['PHI','KC',40,22]},
2025:{sb:'Super Bowl LX',champ:'SEA',afc:{wild:[['BUF','JAX',27,24,6,3],['NE','LAC',16,3,2,7],['HOU','PIT',30,6,5,4]],div:[['DEN','BUF',33,30,1,6],['NE','HOU',28,16,2,5]],conf:[['NE','DEN',10,7,2,1]]},nfc:{wild:[['LAR','CAR',34,31,5,4],['CHI','GB',31,27,2,7],['SF','PHI',23,19,6,3]],div:[['SEA','SF',41,6,1,6],['LAR','CHI',20,17,5,2]],conf:[['SEA','LAR',31,27,1,5]]},sb:['SEA','NE',29,13]},
2026:null};
function logo(abbr){return LOGO+abbr+'.svg'}
function team(abbr,seed,score,win){if(!abbr)return '<div class="btbd">TBD</div>';const fallback=ESPN+abbr.toLowerCase()+'.png';return `<div class="bteam ${win?'winner':''}"><div class="bname"><img src="${logo(abbr)}" onerror="this.onerror=null;this.src='${fallback}'" alt="${NAME[abbr]} Logo"><span>${seed?`<small>#${seed}</small>`:''}${NAME[abbr]}</span></div><b>${score}</b></div>`}
function game(title,g,open=false){if(open)return `<div class="bracket-card"><div class="bracket-title">${title}</div><div class="btbd">TBD</div><div class="btbd">TBD</div><div class="status open">OFFEN</div></div>`;const[a,b,sa,sb,seedA,seedB]=g;return `<div class="bracket-card"><div class="bracket-title">${title}</div>${team(a,seedA,sa,sa>sb)}${team(b,seedB,sb,sb>sa)}<div class="status">FINAL</div></div>`}
function historicalConf(name,d){return `<section class="conf"><h2>${name}</h2><div class="rounds"><div class="round"><h3>WILD CARD</h3>${d.wild.map((g,i)=>game('Spiel '+(i+1),g)).join('')}</div><div class="round"><h3>DIVISIONAL</h3>${d.div.map((g,i)=>game('Spiel '+(i+1),g)).join('')}</div><div class="round"><h3>CONFERENCE</h3>${game('Conference Championship',d.conf[0])}</div></div></section>`}
function openConf(name){return `<section class="conf"><h2>${name}</h2><div class="rounds"><div class="round"><h3>WILD CARD</h3>${[1,2,3].map(i=>game('Spiel '+i,null,true)).join('')}</div><div class="round"><h3>DIVISIONAL</h3>${[1,2].map(i=>game('Spiel '+i,null,true)).join('')}</div><div class="round"><h3>CONFERENCE</h3>${game('Conference Championship',null,true)}</div></div></section>`}
function sbTeam(abbr,score){return `<div class="sb-team"><img src="${logo(abbr)}" onerror="this.onerror=null;this.src='${ESPN+abbr.toLowerCase()+'.png'}'" alt="${NAME[abbr]} Logo"><span>${NAME[abbr]}</span><b>${score}</b></div>`}
function render(){const params=new URLSearchParams(location.search);let season=Number(params.get('season')||2026);if(![2024,2025,2026].includes(season))season=2026;document.getElementById('seasonSelect').value=String(season);document.getElementById('yearTitle').textContent=season;document.getElementById('footerYear').textContent=season;document.getElementById('seasonSelect').onchange=e=>{const u=new URL(location.href);u.searchParams.set('season',e.target.value);location.href=u.toString()};document.querySelectorAll('.nav a').forEach(a=>{const u=new URL(a.href,location.href);u.searchParams.set('season',season);a.href=u.toString()});const box=document.getElementById('playoffBox');if(season===2026){box.innerHTML=`<div class="bracket-note"><b>🏈 Playoffs 2026</b><br>Die Playoff-Paarungen stehen noch nicht fest. Der komplette Baum ist bereits vorbereitet und wird mit den offiziellen Paarungen und Ergebnissen gefüllt, sobald sie feststehen.</div><div class="bracket-wrap">${openConf('AFC')}${openConf('NFC')}</div><div class="superbowl"><div class="super-title">🏆 SUPER BOWL LXI</div><div class="sb-match"><div class="sb-team">TBD</div><strong>vs.</strong><div class="sb-team">TBD</div></div><small>AFC Champion · NFC Champion</small></div>`}else{const d=DATA[season];box.innerHTML=`<div class="bracket-note"><b>🏆 Playoffs ${season}</b><br>Abgeschlossene Saison · alle Playoff-Ergebnisse stehen fest.</div><div class="bracket-wrap">${historicalConf('AFC',d.afc)}${historicalConf('NFC',d.nfc)}</div><div class="superbowl"><div class="super-title">🏆 ${d.sb}</div><div class="sb-match">${sbTeam(d.sb[0],d.sb[2])}<strong>vs.</strong>${sbTeam(d.sb[1],d.sb[3])}</div><small>🏆 Champion: <b>${NAME[d.champ]}</b></small></div>`}}
render();
</script></body></html>
