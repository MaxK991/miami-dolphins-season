<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#008e97"><title>Miami Dolphins · Playoffs</title><style>
:root{--teal:#008e97;--deep:#006a72;--bg:#f2f6f6;--ink:#102629;--muted:#6a7b7e;--line:#dce5e5}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:linear-gradient(135deg,#005c64,#008e97,#00a5aa);color:#fff;box-shadow:0 5px 18px #003f4330}
.container{width:min(1080px,calc(100% - 24px));margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0 10px}
.brand{display:flex;align-items:center;gap:11px}.brand img{width:62px;height:62px;object-fit:contain}.title{font-size:25px;font-weight:950}.subtitle{font-size:12px;opacity:.9}
.season{background:#ffffff18;color:#fff;border:1px solid #ffffff80;border-radius:11px;padding:10px 12px;font-weight:800}
.nav{display:flex;border-top:1px solid #ffffff25}.nav a{flex:1;text-align:center;color:#fff;text-decoration:none;font-size:12px;font-weight:900;padding:11px 3px}.nav a.active{background:#ffffff16;border-bottom:3px solid #fff}
main{padding:16px 0 30px}.summary,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px 16px}.summary h1,.panel h1{margin:0 0 5px;font-size:22px}.summary p,.panel p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.pills{display:flex;gap:7px;overflow:auto;margin-top:12px}.pill{white-space:nowrap;background:#e8f5f5;color:var(--deep);padding:7px 10px;border-radius:999px;font-size:10px;font-weight:900}
.section{margin:20px 2px 9px;border-bottom:2px solid #d0e0e1;padding:8px 2px;color:var(--deep)}.section b{font-size:18px}.section span{margin-left:7px;color:var(--muted);font-size:11px}
.game{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 12px;margin:8px 0;box-shadow:0 5px 15px #123b3d0a}.head{display:flex;justify-content:space-between;align-items:center}.week{font-size:9px;font-weight:900;background:#eaf4f4;color:var(--deep);padding:5px 8px;border-radius:7px}.ha{font-size:9px;color:var(--deep);font-weight:900}
.match{display:grid;grid-template-columns:1fr 38px 1fr;align-items:center;gap:5px;text-align:center;padding:8px 0 5px}.team{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0}.team img{width:55px;height:55px;object-fit:contain;flex:none}.team strong{font-size:13px;line-height:1.12}.team small{font-size:9px;color:var(--muted);font-weight:800}.vs{font-size:10px;font-weight:950;color:var(--deep);border:1px solid #cfe0e1;border-radius:999px;padding:6px 4px}
.result{display:flex;flex-direction:column;align-items:center;gap:3px;margin:3px 0 10px;text-align:center}.result span{font-size:9px;font-weight:950;padding:4px 8px;border-radius:999px}.result b{font-size:24px;letter-spacing:.5px}.loss{background:#ffe8e6;color:#b32f2a}.win{background:#e4f6ea;color:#18743c}
.meta{border-top:1px solid var(--line);padding-top:9px;display:grid;grid-template-columns:130px 1fr 95px;gap:8px;align-items:center}.meta div{display:flex;flex-direction:column;gap:2px}.meta b{font-size:11px;line-height:1.25}.meta small{font-size:9px;color:var(--muted);line-height:1.25}.time{text-align:right}.time b{font-size:19px;color:var(--teal)}
.bye{display:grid;grid-template-columns:105px 1fr;gap:10px;align-items:center;background:#eaf3f3;border:1px dashed #b8cccd;border-radius:14px;padding:12px;margin:8px 0}.bye div{display:flex;flex-direction:column;gap:2px}.bye b{font-size:13px}.bye small{font-size:10px;color:var(--muted)}
.table-scroll{overflow:auto}.standings{width:100%;border-collapse:collapse;font-size:12px}.standings th,.standings td{padding:9px 7px;border-bottom:1px solid #edf1f1;text-align:center}.standings th:nth-child(2),.standings td:nth-child(2){text-align:left}.standings th{font-size:10px;color:var(--muted)}.mia{background:#e8f5f5;color:#006a72;font-weight:900}
.teamname{display:flex;align-items:center;gap:7px;white-space:nowrap}.teamname img{width:28px;height:28px;object-fit:contain}
.subtabs{display:flex;gap:6px;margin:14px 0 10px}.subtabs button{border:0;background:#e8f5f5;color:var(--deep);padding:8px 12px;border-radius:999px;font-size:10px;font-weight:900;cursor:pointer}.subtabs button.active{background:var(--deep);color:#fff}
.note{margin-top:16px;background:#fff8ed;border:1px solid #eedcc4;border-radius:12px;padding:11px;color:#765b38;font-size:10px;line-height:1.45}footer{padding:0 0 28px;color:var(--muted);font-size:10px}
@media(max-width:650px){.container{width:calc(100% - 14px)}.brand img{width:52px;height:52px}.title{font-size:21px}.subtitle{font-size:10px}.top{gap:8px}.season{font-size:12px;padding:8px}.nav a{font-size:10px}.match{grid-template-columns:1fr 32px 1fr}.team{flex-direction:column;gap:3px}.team img{width:48px;height:48px}.team strong{font-size:12px}.meta{grid-template-columns:80px 1fr 70px}.meta b{font-size:10px}.time b{font-size:17px}}

.game .result{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;margin:5px 0 10px}
.game .result span{font-size:9px;font-weight:950;padding:4px 9px;border-radius:999px}
.game .result b{font-size:24px;letter-spacing:.5px}
.game .result .loss{background:#ffe8e6;color:#b32f2a}
.game .result .win{background:#e4f6ea;color:#18743c}
.loading{padding:30px;text-align:center;color:#6a7b7e;font-size:12px}
.playoff-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}
.seed{display:grid;grid-template-columns:30px 1fr 42px;align-items:center;gap:7px;padding:8px;border-bottom:1px solid #edf1f1}
.seed img{width:27px;height:27px;object-fit:contain}.seed .rank{font-weight:950;color:#6a7b7e}.seed .record{text-align:right;font-weight:900}
.seed.mia{background:#e8f5f5;border-radius:10px;color:#006a72}
@media(max-width:650px){.playoff-grid{grid-template-columns:1fr}}
</style></head><body><header><div class="container"><div class="top"><div class="brand">
<img src="https://static.www.nfl.com/league/api/clubs/logos/MIA.svg" alt="Miami Dolphins Logo"><div><div class="title">MIAMI DOLPHINS</div><div class="subtitle">SEASON HUB · deutsche Zeit</div></div></div>
<div class="season">Saison 2026　⌄</div></div>
<nav class="nav">
<a class="" href="index.html">📅 SPIELPLAN</a>
<a class="" href="tabelle.html">🏆 TABELLE</a>
<a class="active" href="playoffs.html">🏈 PLAYOFFS</a>
</nav></div></header>
<main class="container"><section class="panel"><h1>🏈 PLAYOFF PICTURE</h1><p><b>2026 NFL Playoffs</b></p><div id="playoffBox"><div class="loading">Lade aktuelle Playoff-Daten …</div></div></section></main><footer class="container">Private Miami Dolphins Season Hub · 2026</footer><script>
const API="https://site.api.espn.com/apis/site/v2/sports/football/nfl";
const NFLLOGO=a=>`https://static.www.nfl.com/league/api/clubs/logos/${a}.svg`;
const TZ="Europe/Berlin";
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function germanDate(iso){
  if(!iso) return {date:"TBD",day:"TBD",time:"TBD"};
  const d=new Date(iso);
  return {date:new Intl.DateTimeFormat("de-DE",{timeZone:TZ,day:"2-digit",month:"2-digit",year:"numeric"}).format(d),
          day:new Intl.DateTimeFormat("de-DE",{timeZone:TZ,weekday:"long"}).format(d),
          time:new Intl.DateTimeFormat("de-DE",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false}).format(d)};
}
function seasonTypeName(t){return t===1?"PRESEASON":t===2?"REGULAR SEASON":"PLAYOFFS";}
function eventCard(ev){
  const c=ev.competitions?.[0], teams=c?.competitors||[];
  const mia=teams.find(x=>x.team?.abbreviation==="MIA");
  const opp=teams.find(x=>x.team?.abbreviation!=="MIA");
  if(!mia||!opp)return "";
  const home=mia.homeAway==="home", venue=c.venue?.fullName||c.venue?.address?.city||"Stadion noch offen";
  const city=c.venue?.address?.city||c.venue?.address?.state||"";
  const dt=germanDate(ev.date);
  const done=c.status?.type?.completed===true||c.status?.type?.state==="post";
  let result="";
  if(done){
    const ms=Number(mia.score), os=Number(opp.score);
    result=`<div class="result"><span class="${ms>os?"win":"loss"}">${ms>os?"SIEG":"NIEDERLAGE"}</span><b>${os} : ${ms}</b></div>`;
  }
  const phase=seasonTypeName(ev.season?.type||0);
  const week=ev.week?.text||ev.week?.number?`WEEK ${ev.week.number}`:"";
  return `<article class="game">
    <div class="head"><span class="week">${esc(week)}</span><span class="ha">${home?"🏠 HEIMSPIEL":"✈️ AUSWÄRTSSPIEL"}</span></div>
    <div class="match">
      <div class="team"><img src="${NFLLOGO(esc(opp.team.abbreviation))}" alt="${esc(opp.team.displayName)} Logo"><strong>${esc(opp.team.displayName)}</strong><small>${esc(opp.team.abbreviation)}</small></div>
      <div class="vs">${home?"VS":"AT"}</div>
      <div class="team"><img src="${NFLLOGO("MIA")}" alt="Miami Dolphins Logo"><strong>Miami Dolphins</strong><small>MIA</small></div>
    </div>
    ${result}
    <div class="meta"><div><b>${dt.date}</b><small>${esc(dt.day)}</small></div><div><b>🏟️ ${esc(venue)}</b><small>📍 ${esc(city)}</small></div><div class="time"><b>${dt.time}</b><small>deutsche Zeit</small></div></div>
  </article>`;
}
async function loadSchedule(){
 const box=document.getElementById("scheduleBox");
 try{
  const r=await fetch(`${API}/teams/mia/schedule?season=2026`,{cache:"no-store"});
  if(!r.ok) throw new Error();
  const j=await r.json();
  const events=j.events||[];
  const groups={1:[],2:[],3:[]};
  events.forEach(e=>{const t=e.season?.type; if(groups[t])groups[t].push(e);});
  let out="";
  for(const t of [1,2,3]){
    if(!groups[t].length) continue;
    out+=`<div class="section"><b>${seasonTypeName(t)}</b><span>${t===1?"Vorbereitung":t===2?"Pflichtspiele":"Playoffs"}</span></div>`;
    out+=groups[t].map(eventCard).join("");
  }
  box.innerHTML=out||'<div class="loading">Aktuell keine Spiele verfügbar.</div>';
  document.getElementById("updated").textContent="Live aktualisiert: "+new Date().toLocaleString("de-DE");
 }catch(e){
  box.innerHTML='<div class="loading">Die aktuellen NFL-Daten konnten gerade nicht geladen werden. Bitte später erneut öffnen.</div>';
 }
}
function flattenEntries(node,out=[]){
 if(!node||typeof node!=="object")return out;
 if(Array.isArray(node)) {node.forEach(x=>flattenEntries(x,out));return out;}
 if(node.team?.abbreviation && Array.isArray(node.stats)) out.push(node);
 for(const v of Object.values(node)) if(v&&typeof v==="object") flattenEntries(v,out);
 return out;
}
function statsMap(e){const s={};(e.stats||[]).forEach(x=>s[x.name]=x.value);return s;}
async function getStandings(){
 const r=await fetch(`${API.replace("/site/v2","/v2")}/standings?season=2026`,{cache:"no-store"});
 if(!r.ok)throw new Error();
 const j=await r.json();
 return flattenEntries(j,[]).filter((e,i,a)=>a.findIndex(x=>x.team.abbreviation===e.team.abbreviation)===i).map(e=>{
  const s=statsMap(e);return {a:e.team.abbreviation,n:e.team.displayName,w:Number(s.wins||0),l:Number(s.losses||0),t:Number(s.ties||0),p:Number(s.winPercent||0),logo:e.team.logos?.[0]?.href||NFLLOGO(e.team.abbreviation)};
 });
}
function row(x,i){return `<tr class="${x.a==="MIA"?"mia":""}"><td>${i+1}</td><td><div class="teamname"><img src="${x.logo}" alt="">${esc(x.n)}</div></td><td>${x.w}</td><td>${x.l}</td><td>${x.t}</td><td>${x.p.toFixed(3)}</td></tr>`;}
async function loadTable(){
 const body=document.getElementById("tbody");
 try{
  const all=await getStandings();
  const east=all.filter(x=>["BUF","MIA","NE","NYJ"].includes(x.a)).sort((a,b)=>(b.p-a.p)||(b.w-a.w)||(a.l-b.l));
  body.innerHTML=east.map((x,i)=>row(x,i)).join("");
  document.getElementById("stamp").textContent="Live aktualisiert: "+new Date().toLocaleString("de-DE");
 }catch(e){body.innerHTML='<tr><td colspan="6">Aktuelle Tabelle konnte nicht geladen werden.</td></tr>';}
}
async function loadPlayoffs(){
 const box=document.getElementById("playoffBox");
 try{
  const all=await getStandings();
  const mia=all.find(x=>x.a==="MIA");
  const afc=all.filter(x=>["BUF","MIA","NE","NYJ","BAL","CIN","CLE","PIT","HOU","IND","JAX","TEN","DEN","KC","LV","LAC"].includes(x.a))
    .sort((a,b)=>(b.p-a.p)||(b.w-a.w)||(a.l-b.l));
  const started=all.some(x=>x.w||x.l||x.t);
  if(!mia){box.innerHTML="Keine Dolphins-Daten verfügbar.";return;}
  const seed=afc.findIndex(x=>x.a==="MIA")+1;
  box.innerHTML=`<div style="text-align:center;padding:18px 5px"><img src="${mia.logo}" style="width:85px;height:85px;object-fit:contain"><h2 style="margin:7px 0">Miami Dolphins</h2>
  <div style="font-size:22px;font-weight:950;color:var(--teal)">${started?`#${seed} AFC Seed`:"Regular Season noch nicht gestartet"}</div>
  <p>${started?`Aktuelle Bilanz: ${mia.w}-${mia.l}${mia.t?"-"+mia.t:""}`:"Die Preseason-Bilanz zählt nicht für die Playoff-Platzierung."}</p></div>
  <div class="playoff-grid"><div class="panel"><h2 style="margin-top:0">AFC Playoff Picture</h2>${afc.slice(0,7).map((x,i)=>`<div class="seed ${x.a==="MIA"?"mia":""}"><span class="rank">${i+1}</span><span class="teamname"><img src="${x.logo}">${esc(x.n)}</span><span class="record">${x.w}-${x.l}</span></div>`).join("")}</div>
  <div class="panel"><h2 style="margin-top:0">Miami Status</h2><p>${started?"Die Dolphins werden anhand der aktuellen AFC-Bilanz eingeordnet.":"Mit Start der Regular Season wird hier automatisch der aktuelle AFC-Seed angezeigt."}</p></div></div>
  <div class="note"><b>🔄 Live:</b> Diese Seite lädt die aktuelle Tabelle beim Öffnen neu.</div>`;
 }catch(e){box.innerHTML='<div class="loading">Aktuelle Playoff-Daten konnten nicht geladen werden.</div>';}
}
setInterval(()=>{ if(location.pathname.endsWith("index.html")||location.pathname.endsWith("/"))loadSchedule(); },86400000);
loadPlayoffs();</script></body></html>
