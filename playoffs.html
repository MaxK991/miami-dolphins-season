</style></head><body><header><div class="container"><div class="top"><div class="brand"><img src="https://static.www.nfl.com/league/api/clubs/logos/MIA.svg" alt="Miami Dolphins Logo"><div><div class="title">MIAMI DOLPHINS</div><div class="subtitle">SEASON HUB</div></div></div><div class="season"><select id="seasonSelect" aria-label="Saison auswählen"><option value="2030">Saison 2030</option><option value="2029">Saison 2029</option><option value="2028">Saison 2028</option><option value="2027">Saison 2027</option><option value="2026">Saison 2026</option><option value="2025">Saison 2025</option><option value="2024">Saison 2024</option></select></div></div><nav class="nav"><a href="index.html">📅 SPIELPLAN</a><a href="tabelle.html">🏆 TABELLE</a><a class="active" href="playoffs.html">🏈 PLAYOFFS</a></nav></div></header><main class="container"><section class="summary"><h1>🏈 PLAYOFFS</h1><p><span id="yearTitle">2026</span> NFL Playoffs</p></section><section class="panel"><div id="playoffBox"><div class="bracket-note">Lade Playoffs …</div></div></section></main><footer class="container">Private Miami Dolphins Season Hub · <span id="footerYear">2026</span></footer><script>
(function(){
const LOGO='https://static.www.nfl.com/league/api/clubs/logos/';
const ESPN='https://a.espncdn.com/i/teamlogos/nfl/500/';
const NAME={MIA:'Miami Dolphins',BUF:'Buffalo Bills',NE:'New England Patriots',NYJ:'New York Jets',BAL:'Baltimore Ravens',CIN:'Cincinnati Bengals',PIT:'Pittsburgh Steelers',HOU:'Houston Texans',DEN:'Denver Broncos',KC:'Kansas City Chiefs',LAC:'Los Angeles Chargers',JAX:'Jacksonville Jaguars',SEA:'Seattle Seahawks',SF:'San Francisco 49ers',PHI:'Philadelphia Eagles',GB:'Green Bay Packers',CHI:'Chicago Bears',DET:'Detroit Lions',WAS:'Washington Commanders',TB:'Tampa Bay Buccaneers',MIN:'Minnesota Vikings',LAR:'Los Angeles Rams',CAR:'Carolina Panthers'};
const DATA={
2024:{sbTitle:'Super Bowl LIX',stadium:'Caesars Superdome · New Orleans, Louisiana',champ:'PHI',afc:{wild:[['HOU','LAC',32,12,4,5],['BAL','PIT',28,14,3,6],['BUF','DEN',31,7,2,7]],div:[['KC','HOU',23,14,1,4],['BUF','BAL',27,25,2,3]],conf:[['KC','BUF',32,29,1,2]]},nfc:{wild:[['PHI','GB',22,10,2,7],['TB','WAS',20,23,4,6],['LAR','MIN',27,9,4,5]],div:[['DET','WAS',31,45,1,6],['PHI','LAR',28,22,2,4]],conf:[['PHI','WAS',55,23,2,6]]},sb:['PHI','KC',40,22]},
2025:{sbTitle:'Super Bowl LX',stadium:"Levi's Stadium · Santa Clara, California",champ:'SEA',afc:{wild:[['BUF','JAX',27,24,6,3],['NE','LAC',16,3,2,7],['HOU','PIT',30,6,5,4]],div:[['DEN','BUF',33,30,1,6],['NE','HOU',28,16,2,5]],conf:[['NE','DEN',10,7,2,1]]},nfc:{wild:[['LAR','CAR',34,31,5,4],['CHI','GB',31,27,2,7],['SF','PHI',23,19,6,3]],div:[['SEA','SF',41,6,1,6],['LAR','CHI',20,17,5,2]],conf:[['SEA','LAR',31,27,1,5]]},sb:['SEA','NE',29,13]},
2026:null,2027:null,2028:null,2029:null,2030:null};
const SUPER={2024:['Super Bowl LIX','Caesars Superdome · New Orleans, Louisiana'],2025:['Super Bowl LX',"Levi's Stadium · Santa Clara, California"],2026:['Super Bowl LXI','SoFi Stadium · Inglewood, California'],2027:['Super Bowl LXII','Mercedes-Benz Stadium · Atlanta, Georgia'],2028:['Super Bowl LXIII','Allegiant Stadium · Las Vegas, Nevada'],2029:['Super Bowl LXIV','Nissan Stadium · Nashville, Tennessee'],2030:['Super Bowl LXV','Austragungsort noch offen']};
function season(){const n=Number(new URLSearchParams(location.search).get('season'));return [2024,2025,2026,2027,2028,2029,2030].includes(n)?n:2026}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function team(abbr,seed,score,win){const fallback=ESPN+String(abbr).toLowerCase()+'.png';return '<div class="bteam '+(win?'winner':'')+'"><div class="bname"><img src="'+LOGO+abbr+'.svg" onerror="this.onerror=null;this.src=\''+fallback+'\'" alt="'+esc(NAME[abbr])+' Logo"><span>'+(seed?'<small>#'+seed+'</small>':'')+esc(NAME[abbr])+'</span></div><b>'+score+'</b></div>'}
function game(title,g,open){if(open)return '<div class="bracket-card"><div class="bracket-title">'+title+'</div><div class="btbd">TBD</div><div class="btbd">TBD</div><div class="status open">OFFEN</div></div>';const a=g[0],b=g[1],sa=g[2],sb=g[3];return '<div class="bracket-card"><div class="bracket-title">'+title+'</div>'+team(a,g[4],sa,sa>sb)+team(b,g[5],sb,sb>sa)+'<div class="status">FINAL</div></div>'}
function conf(name,d,open){if(open){return '<section class="conf"><h2>'+name+'</h2><div class="rounds"><div class="round"><h3>WILD CARD</h3>'+[1,2,3].map(i=>game('Spiel '+i,null,true)).join('')+'</div><div class="round"><h3>DIVISIONAL</h3>'+[1,2].map(i=>game('Spiel '+i,null,true)).join('')+'</div><div class="round"><h3>CONFERENCE</h3>'+game('Conference Championship',null,true)+'</div></div></section>'}return '<section class="conf"><h2>'+name+'</h2><div class="rounds"><div class="round"><h3>WILD CARD</h3>'+d.wild.map((g,i)=>game('Spiel '+(i+1),g,false)).join('')+'</div><div class="round"><h3>DIVISIONAL</h3>'+d.div.map((g,i)=>game('Spiel '+(i+1),g,false)).join('')+'</div><div class="round"><h3>CONFERENCE</h3>'+game('Conference Championship',d.conf[0],false)+'</div></div></section>'}
function sbTeam(abbr,score){const fallback=ESPN+abbr.toLowerCase()+'.png';return '<div class="sb-team"><img src="'+LOGO+abbr+'.svg" onerror="this.onerror=null;this.src=\''+fallback+'\'" alt="'+esc(NAME[abbr])+' Logo"><span>'+esc(NAME[abbr])+'</span><b>'+score+'</b></div>'}
function render(){const y=season(), info=SUPER[y]||['Super Bowl','Austragungsort noch offen'];document.getElementById('seasonSelect').value=String(y);document.getElementById('yearTitle').textContent=String(y);document.getElementById('footerYear').textContent=String(y);document.querySelectorAll('.nav a').forEach(a=>{const u=new URL(a.getAttribute('href'),location.href);u.search='?season='+y;a.href=u.href});const select=document.getElementById('seasonSelect');select.onchange=function(){location.href='playoffs.html?season='+this.value};const box=document.getElementById('playoffBox');if(DATA[y]){const d=DATA[y];box.innerHTML='<div class="bracket-note"><b>🏆 Playoffs '+y+'</b><br>Abgeschlossene Saison · alle Playoff-Ergebnisse stehen fest.</div><div class="bracket-wrap">'+conf('AFC',d.afc,false)+conf('NFC',d.nfc,false)+'</div><div class="superbowl"><div class="super-title">🏆 '+d.sbTitle+'</div><div class="sb-match">'+sbTeam(d.sb[0],d.sb[2])+'<strong>vs.</strong>'+sbTeam(d.sb[1],d.sb[3])+'</div><small>📍 '+d.stadium+'</small><small>🏆 Champion: <b>'+esc(NAME[d.champ])+'</b></small></div>'}else{box.innerHTML='<div class="bracket-note"><b>🏈 Playoffs '+y+'</b><br>Die Playoff-Paarungen stehen noch nicht fest. Der Baum ist vorbereitet und wird mit den offiziellen Paarungen und Ergebnissen gefüllt, sobald sie feststehen.</div><div class="bracket-wrap">'+conf('AFC',null,true)+conf('NFC',null,true)+'</div><div class="superbowl"><div class="super-title">🏆 '+info[0]+'</div><div class="sb-match"><div class="sb-team">TBD</div><strong>vs.</strong><div class="sb-team">TBD</div></div><small>📍 '+info[1]+'</small></div>'}}
try{render()}catch(e){console.error(e);document.getElementById('playoffBox').innerHTML='<div class="bracket-note"><b>Fehler beim Laden der Playoffs.</b><br>'+esc(e.message)+'</div>'}
})();
</script></body></html>
