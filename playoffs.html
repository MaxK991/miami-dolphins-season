<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#008e97"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon.png"><title>Miami Dolphins · Playoffs</title><style>
:root{--teal:#008e97;--deep:#006a72;--bg:#f2f6f6;--ink:#102629;--muted:#6a7b7e;--line:#dce5e5;--win:#e4f6ea;--gold:#f58220}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:linear-gradient(135deg,#005c64,#008e97,#00a5aa);color:#fff;box-shadow:0 5px 18px #003f4330}.container{width:min(1180px,calc(100% - 24px));margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0 10px}.brand{display:flex;align-items:center;gap:11px}.brand img{width:62px;height:62px;object-fit:contain}.title{font-size:25px;font-weight:950}.subtitle{font-size:12px;opacity:.9}.season{position:relative;background:#ffffff18;color:#fff;border:1px solid #ffffff80;border-radius:11px;padding:10px 12px;font-weight:800}.season:after{content:"⌄";position:absolute;right:14px;top:50%;transform:translateY(-55%);pointer-events:none;color:#fff;font-weight:900}.season select{appearance:none;background:transparent;color:#fff;border:0;outline:0;font:inherit;font-weight:800;font-size:inherit;padding-right:18px;cursor:pointer}.season option{color:#102629;background:#fff}.nav{display:flex;border-top:1px solid #ffffff25}.nav a{flex:1;text-align:center;color:#fff;text-decoration:none;font-size:12px;font-weight:900;padding:11px 3px}.nav a.active{background:#ffffff16;border-bottom:3px solid #fff}
main{padding:16px 0 30px}.summary,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px 16px}.summary h1{margin:0 0 5px;font-size:22px}.summary p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.summary .hint{margin-top:10px;color:var(--deep);font-weight:800}.section{margin:20px 2px 9px;border-bottom:2px solid #d0e0e1;padding:8px 2px;color:var(--deep)}.section b{font-size:18px}.section span{margin-left:7px;color:var(--muted);font-size:11px}
.bracket-shell{margin-top:14px}.conference{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 5px 15px #123b3d0a;margin-bottom:14px}.conference h2{margin:0 0 12px;color:var(--deep);font-size:18px}.round-grid{display:grid;grid-template-columns:1.2fr 1.05fr .95fr;gap:14px;align-items:stretch}.round{min-width:0}.round-title{text-align:center;color:var(--muted);font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.4px;margin:0 0 8px}.games{display:flex;flex-direction:column;gap:12px}.round.divisional .games{padding-top:27px}.round.conference .games{padding-top:74px}.match-card{position:relative;background:#f9fbfb;border:1px solid var(--line);border-radius:12px;overflow:hidden}.match-card.winner{border-color:#9ed6b1}.match-card .game-head{padding:6px 8px;font-size:8px;color:var(--muted);font-weight:850;border-bottom:1px solid #edf1f1}.teamrow{display:grid;grid-template-columns:24px 24px 1fr 28px;align-items:center;gap:5px;padding:7px 8px;border-bottom:1px solid #edf1f1;min-height:39px}.teamrow:last-child{border-bottom:0}.teamrow img{width:22px;height:22px;object-fit:contain}.seednum{font-size:9px;color:var(--muted);font-weight:900;text-align:center}.teamrow .name{font-size:10px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.teamrow .score{font-size:12px;font-weight:950;text-align:right}.teamrow.won{background:#edf8f0}.teamrow.won .name,.teamrow.won .score{color:#18743c}.teamrow.tbd{color:#9aa8aa}.teamrow.tbd img{opacity:.25}.connector{display:none}.superbowl{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin-top:14px;text-align:center}.superbowl h2{margin:0 0 3px;color:var(--deep);font-size:18px}.superbowl p{margin:0 0 10px;color:var(--muted);font-size:10px}.sb-card{max-width:520px;margin:auto;border:2px solid #d9e5e5;border-radius:14px;overflow:hidden}.champ{display:grid;grid-template-columns:28px 28px 1fr 45px;align-items:center;gap:6px;padding:10px 12px;background:#f9fbfb}.champ:first-child{border-bottom:1px solid var(--line)}.champ img{width:25px;height:25px;object-fit:contain}.champ .name{font-size:13px;font-weight:900;text-align:left}.champ .score{font-size:15px;font-weight:950}.champ.tbd{color:#9aa8aa}.champ.won{background:#fff8e9;color:#8a5a00}.trophy{font-size:25px;margin-top:9px}.status{margin:12px 0 0;background:#e8f5f5;color:var(--deep);border-radius:11px;padding:10px;font-size:10px;font-weight:800}.note{margin-top:14px;background:#fff8ed;border:1px solid #eedcc4;border-radius:12px;padding:11px;color:#765b38;font-size:10px;line-height:1.45}footer{padding:0 0 28px;color:var(--muted);font-size:10px}
@media(max-width:760px){.container{width:calc(100% - 14px)}.brand img{width:52px;height:52px}.title{font-size:21px}.subtitle{font-size:10px}.top{gap:8px}.season{font-size:12px;padding:8px}.nav a{font-size:10px}.round-grid{grid-template-columns:1fr;gap:12px}.round.divisional .games,.round.conference .games{padding-top:0}.round-title{text-align:left}.conference{padding:11px}.match-card .game-head{font-size:8px}.teamrow .name{font-size:11px}.superbowl{margin-top:12px}}
</style></head><body><header><div class="container"><div class="top"><div class="brand"><img src="https://static.www.nfl.com/league/api/clubs/logos/MIA.svg" alt="Miami Dolphins Logo"><div><div class="title">MIAMI DOLPHINS</div><div class="subtitle">SEASON HUB</div></div></div><div class="season"><select id="seasonSelect" aria-label="Saison auswählen"><option value="2026">Saison 2026</option><option value="2025">Saison 2025</option><option value="2024">Saison 2024</option></select></div></div><nav class="nav"><a class="" href="index.html">📅 SPIELPLAN</a><a class="" href="tabelle.html">🏆 TABELLE</a><a class="active" href="playoffs.html">🏈 PLAYOFFS</a></nav></div></header><main class="container"><section class="summary"><h1>🏈 PLAYOFFS · <span id="yearTitle">2026</span></h1><p id="seasonMeta">Aktueller Playoff-Turnierbaum</p><p class="hint" id="seasonHint">Noch keine Playoff-Teilnehmer festgelegt – der Baum bleibt offen, bis die Regular Season abgeschlossen ist.</p></section><div id="playoffBox" class="bracket-shell"><div class="loading">Lade Playoff-Turnierbaum …</div></div></main></main><footer class="container">Private Miami Dolphins Season Hub · <span id="footerYear">2026</span></footer><script>
const API="https://site.api.espn.com/apis/site/v2/sports/football/nfl";
const TZ="Europe/Berlin";
const params=new URLSearchParams(location.search); let SEASON=Number(params.get('season')||2026); if(![2024,2025,2026].includes(SEASON))SEASON=2026;
const LOGOS={MIA:'https://static.www.nfl.com/league/api/clubs/logos/MIA.svg'};
const NAME={ARI:'Arizona Cardinals',ATL:'Atlanta Falcons',BAL:'Baltimore Ravens',BUF:'Buffalo Bills',CAR:'Carolina Panthers',CHI:'Chicago Bears',CIN:'Cincinnati Bengals',CLE:'Cleveland Browns',DAL:'Dallas Cowboys',DEN:'Denver Broncos',DET:'Detroit Lions',GB:'Green Bay Packers',HOU:'Houston Texans',IND:'Indianapolis Colts',JAX:'Jacksonville Jaguars',KC:'Kansas City Chiefs',LAC:'Los Angeles Chargers',LAR:'Los Angeles Rams',LV:'Las Vegas Raiders',MIA:'Miami Dolphins',MIN:'Minnesota Vikings',NE:'New England Patriots',NO:'New Orleans Saints',NYG:'New York Giants',NYJ:'New York Jets',PHI:'Philadelphia Eagles',PIT:'Pittsburgh Steelers',SEA:'Seattle Seahawks',SF:'San Francisco 49ers',TB:'Tampa Bay Buccaneers',TEN:'Tennessee Titans',WAS:'Washington Commanders'};
function logo(abbr){return LOGOS[abbr]||`https://static.www.nfl.com/league/api/clubs/logos/${abbr}.svg`;}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function datesForSeason(y){return {wc:[`${y+1}-01-01`,`${y+1}-01-20`],div:[`${y+1}-01-21`,`${y+1}-01-27`],conf:[`${y+1}-01-28`,`${y+1}-02-03`],sb:[`${y+1}-02-04`,`${y+1}-02-20`]};}
async function fetchRange(a,b){const u=`${API}/scoreboard?dates=${a.replaceAll('-','')}-${b.replaceAll('-','')}&limit=100`;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('NFL API '+r.status);const j=await r.json();return j.events||[];}
function roundFor(ev,year){const d=new Date(ev.date);const y=year+1;const day=(d-new Date(`${y}-01-01`))/86400000;if(day>=8&&day<=20)return 'wc';if(day>=21&&day<=27)return 'div';if(day>=28&&day<=34)return 'conf';if(day>=35&&day<=50)return 'sb';return null;}
function compTeams(ev){return ev.competitions?.[0]?.competitors||[];}
function getTeam(x){const t=x?.team||{};return {abbr:t.abbreviation||'',name:t.displayName||t.shortDisplayName||NAME[t.abbreviation]||'TBD',seed:x?.curatedRank?.current||x?.seed||'',score:(x?.score!==undefined&&x?.score!==null)?Number(x.score):null,won:x?.winner===true};}
function card(ev){const ts=compTeams(ev);if(ts.length<2)return '';let a=getTeam(ts[0]),b=getTeam(ts[1]);const c=ev.competitions?.[0];const done=c?.status?.type?.completed===true||c?.status?.type?.state==='post';if(done&&a.score!==null&&b.score!==null){a.won=a.score>b.score;b.won=b.score>a.score;}const label=ev.name||c?.shortName||'Playoff-Spiel';return `<div class="match-card ${done?'winner':''}"><div class="game-head">${esc(label)}</div>${teamRow(a)}${teamRow(b)}</div>`;}
function teamRow(t){const tbd=!t.abbr;return `<div class="teamrow ${t.won?'won':''} ${tbd?'tbd':''}"><span class="seednum">${esc(t.seed||'')}</span><img src="${tbd?'':logo(t.abbr)}" alt=""><span class="name">${esc(t.name)}</span><span class="score">${t.score===null?'—':t.score}</span></div>`;}
function sortEvents(a,b){return new Date(a.date)-new Date(b.date);}
function renderRound(title,events,cls){return `<div class="round ${cls}"><div class="round-title">${title}</div><div class="games">${events.length?events.sort(sortEvents).map(card).join(''):`<div class="match-card"><div class="game-head">Noch offen</div>${teamRow({name:'TBD',score:null})}${teamRow({name:'TBD',score:null})}</div>`}</div></div>`;}
function splitConference(events,conf){return events.filter(ev=>{const ts=compTeams(ev);return ts.some(x=>x.team?.conferenceId===conf||x.team?.conference===conf);});}
async function load(){const box=document.getElementById('playoffBox');try{const d=datesForSeason(SEASON);const all=await Promise.all(Object.values(d).map(x=>fetchRange(x[0],x[1])));const events=[...new Map(all.flat().map(e=>[e.id,e])).values()].filter(e=>e.season?.year===SEASON||e.season?.displayName?.includes(String(SEASON))).filter(e=>e.competitions?.[0]?.competitors?.length===2);const rounds={wc:events.filter(e=>roundFor(e,SEASON)==='wc'),div:events.filter(e=>roundFor(e,SEASON)==='div'),conf:events.filter(e=>roundFor(e,SEASON)==='conf'),sb:events.filter(e=>roundFor(e,SEASON)==='sb')};
const historical=events.some(e=>e.competitions?.[0]?.status?.type?.completed);const current=SEASON===2026&&!historical;document.getElementById('yearTitle').textContent=SEASON;document.getElementById('seasonMeta').textContent=SEASON===2026?'NFL Playoffs 2026 · Stand heute noch offen':'NFL Playoffs '+SEASON+' · vollständiger Turnierverlauf';document.getElementById('seasonHint').textContent=current?'Noch keine Playoff-Teilnehmer festgelegt – der Baum bleibt offen, bis die Regular Season abgeschlossen ist.':historical?'Ergebnisse werden automatisch angezeigt; Sieger rücken in die nächste Runde auf.':'Playoff-Daten werden angezeigt, sobald die NFL die Begegnungen veröffentlicht.';
if(!events.length){box.innerHTML=`<div class="conference"><h2>🏆 AFC</h2>${renderRound('Wild Card',[], 'wild')}</div><div class="conference"><h2>🏆 NFC</h2>${renderRound('Wild Card',[], 'wild')}</div><div class="superbowl"><h2>🏆 Super Bowl</h2><p>Finale zwischen AFC- und NFC-Champion</p><div class="sb-card">${teamRow({name:'AFC Champion',score:null})}${teamRow({name:'NFC Champion',score:null})}</div></div>`;return;}
const afcTeams=['BUF','MIA','NE','NYJ','BAL','CIN','CLE','PIT','HOU','IND','JAX','TEN','DEN','KC','LV','LAC'];const nfcTeams=['DAL','NYG','PHI','WAS','CHI','DET','GB','MIN','ATL','CAR','NO','TB','ARI','LAR','SF','SEA'];
function belongs(ev,list){return compTeams(ev).some(x=>list.includes(x.team?.abbreviation));}
const afc={wc:rounds.wc.filter(e=>belongs(e,afcTeams)),div:rounds.div.filter(e=>belongs(e,afcTeams)),conf:rounds.conf.filter(e=>belongs(e,afcTeams))};const nfc={wc:rounds.wc.filter(e=>belongs(e,nfcTeams)),div:rounds.div.filter(e=>belongs(e,nfcTeams)),conf:rounds.conf.filter(e=>belongs(e,nfcTeams))};
box.innerHTML=`<div class="conference"><h2>🏆 AFC</h2><div class="round-grid">${renderRound('Wild Card',afc.wc,'wild')}${renderRound('Divisional',afc.div,'divisional')}${renderRound('Conference',afc.conf,'conference')}</div></div><div class="conference"><h2>🏆 NFC</h2><div class="round-grid">${renderRound('Wild Card',nfc.wc,'wild')}${renderRound('Divisional',nfc.div,'divisional')}${renderRound('Conference',nfc.conf,'conference')}</div></div>${renderSuperBowl(rounds.sb)}`;
}catch(e){console.error(e);box.innerHTML='<div class="errorbox">Der Playoff-Turnierbaum konnte gerade nicht geladen werden. Bitte Seite neu laden.</div>';}}
function renderSuperBowl(events){if(!events.length)return `<div class="superbowl"><h2>🏆 Super Bowl</h2><p>Finale zwischen AFC- und NFC-Champion</p><div class="sb-card">${teamRow({name:'AFC Champion',score:null})}${teamRow({name:'NFC Champion',score:null})}</div><div class="status">⏳ Noch offen</div></div>`;return `<div class="superbowl"><h2>🏆 Super Bowl</h2><p>Finale</p><div class="sb-card">${events.sort(sortEvents).map(card).join('')}</div><div class="trophy">🏆</div></div>`;}
const s=document.getElementById('seasonSelect');if(s){s.value=String(SEASON);s.addEventListener('change',()=>{const u=new URL(location.href);u.searchParams.set('season',s.value);location.href=u.toString();});}document.querySelectorAll('.nav a').forEach(a=>{const u=new URL(a.href,location.href);u.searchParams.set('season',SEASON);a.href=u.toString();});load();
</script></body></html>
