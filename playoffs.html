<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#008e97"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon.png"><title>Miami Dolphins · Playoffs</title><style>
:root{--teal:#008e97;--deep:#006a72;--bg:#f2f6f6;--ink:#102629;--muted:#6a7b7e;--line:#dce5e5}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:linear-gradient(135deg,#005c64,#008e97,#00a5aa);color:#fff;box-shadow:0 5px 18px #003f4330}.container{width:min(1080px,calc(100% - 24px));margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0 10px}.brand{display:flex;align-items:center;gap:11px}.brand img{width:62px;height:62px;object-fit:contain}.title{font-size:25px;font-weight:950}.subtitle{font-size:12px;opacity:.9}.season{position:relative;background:#ffffff18;color:#fff;border:1px solid #ffffff80;border-radius:11px;padding:10px 12px;font-weight:800}.season:after{content:"⌄";position:absolute;right:14px;top:50%;transform:translateY(-55%);pointer-events:none;color:#fff;font-weight:900}.season select{appearance:none;background:transparent;color:#fff;border:0;outline:0;font:inherit;font-weight:800;font-size:inherit;padding-right:18px;cursor:pointer}.season option{color:#102629;background:#fff}
.nav{display:flex;border-top:1px solid #ffffff25}.nav a{flex:1;text-align:center;color:#fff;text-decoration:none;font-size:12px;font-weight:900;padding:11px 3px}.nav a.active{background:#ffffff16;border-bottom:3px solid #fff}
main{padding:16px 0 30px}.summary,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px 16px}.summary h1,.panel h1{margin:0 0 5px;font-size:22px}.summary p,.panel p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.pills{display:flex;gap:7px;overflow:auto;margin-top:12px}.pill{white-space:nowrap;background:#e8f5f5;color:var(--deep);padding:7px 10px;border-radius:999px;font-size:10px;font-weight:900}
.section{margin:20px 2px 9px;border-bottom:2px solid #d0e0e1;padding:8px 2px;color:var(--deep)}.section b{font-size:18px}.section span{margin-left:7px;color:var(--muted);font-size:11px}.game{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 12px;margin:8px 0;box-shadow:0 5px 15px #123b3d0a}.head{display:flex;justify-content:space-between;align-items:center}.week{font-size:9px;font-weight:900;background:#eaf4f4;color:var(--deep);padding:5px 8px;border-radius:7px}.ha{font-size:9px;color:var(--deep);font-weight:900}.match{display:grid;grid-template-columns:1fr 38px 1fr;align-items:center;gap:5px;text-align:center;padding:8px 0 5px}.team{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0}.team img{width:55px;height:55px;object-fit:contain;flex:none}.team strong{font-size:13px;line-height:1.12}.team small{font-size:9px;color:var(--muted);font-weight:800}.vs{font-size:10px;font-weight:950;color:var(--deep);border:1px solid #cfe0e1;border-radius:999px;padding:6px 4px}.result{display:flex;flex-direction:column;align-items:center;gap:3px;margin:3px 0 10px;text-align:center}.result span{font-size:9px;font-weight:950;padding:4px 8px;border-radius:999px}.result b{font-size:24px;letter-spacing:.5px}.loss{background:#ffe8e6;color:#b32f2a}.win{background:#e4f6ea;color:#18743c}.tie{background:#eef2f2;color:#586a6d}.meta{border-top:1px solid var(--line);padding-top:9px;display:grid;grid-template-columns:130px 1fr 95px;gap:8px;align-items:center}.meta div{display:flex;flex-direction:column;gap:2px}.meta b{font-size:11px;line-height:1.25}.meta small{font-size:9px;color:var(--muted);line-height:1.25}.time{text-align:right}.time b{font-size:19px;color:var(--teal)}
.loading,.errorbox{padding:30px;text-align:center;color:#6a7b7e;font-size:12px}.note{margin-top:16px;background:#fff8ed;border:1px solid #eedcc4;border-radius:12px;padding:11px;color:#765b38;font-size:10px;line-height:1.45}footer{padding:0 0 28px;color:var(--muted);font-size:10px}.table-scroll{overflow:auto}.standings{width:100%;border-collapse:collapse;font-size:12px}.standings th,.standings td{padding:9px 7px;border-bottom:1px solid #edf1f1;text-align:center}.standings th:nth-child(2),.standings td:nth-child(2){text-align:left}.standings th{font-size:10px;color:var(--muted)}.mia{background:#e8f5f5;color:#006a72;font-weight:900}.teamname{display:flex;align-items:center;gap:7px;white-space:nowrap}.teamname img{width:28px;height:28px;object-fit:contain}.playoff-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}.seed{display:grid;grid-template-columns:30px 1fr 42px;align-items:center;gap:7px;padding:8px;border-bottom:1px solid #edf1f1}.seed img{width:27px;height:27px;object-fit:contain}.seed .rank{font-weight:950;color:#6a7b7e}.seed .record{text-align:right;font-weight:900}.seed.mia{background:#e8f5f5;border-radius:10px;color:#006a72}
 .bracket-note{margin:14px 0;padding:13px;border-radius:12px;background:#eef7f7;border:1px solid #d3e8e8;color:#36595c;font-size:12px;line-height:1.5}.bracket-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.conf{background:#f8fbfb;border:1px solid var(--line);border-radius:14px;padding:12px;overflow:auto}.conf h2{margin:0 0 10px;color:var(--deep);font-size:18px}.rounds{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:10px;min-width:500px}.round h3{font-size:10px;color:var(--muted);margin:0 0 7px}.bracket-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px;margin-bottom:9px;box-shadow:0 2px 7px #123b3d08}.bracket-title{font-size:9px;font-weight:900;color:var(--muted);margin-bottom:5px}.bracket-team{display:flex;justify-content:space-between;gap:8px;padding:5px 3px;border-bottom:1px solid #edf1f1;font-size:10px}.bracket-team:last-of-type{border-bottom:0}.bracket-team small{color:var(--muted);margin-right:4px}.bracket-status{font-size:8px;font-weight:900;color:#8a999b;margin-top:5px;text-align:right}.superbowl{margin-top:14px;background:linear-gradient(135deg,#fff,#eef8f8);border:1px solid #cde4e5;border-radius:15px;padding:14px;text-align:center}.super-title{font-weight:950;color:var(--deep);font-size:17px}.sb-match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:10px;font-weight:900}.sb-match div{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px}.superbowl small{display:block;color:var(--muted);margin-top:7px}.sb-match div{display:flex;align-items:center;justify-content:center;gap:8px}.sb-match img{width:32px;height:32px;object-fit:contain}.sb-match b{font-size:20px;margin-left:4px}@media(max-width:650px){.container{width:calc(100% - 14px)}.brand img{width:52px;height:52px}.title{font-size:21px}.subtitle{font-size:10px}.top{gap:8px}.season{font-size:12px;padding:8px}.nav a{font-size:10px}.match{grid-template-columns:1fr 32px 1fr}.team{flex-direction:column;gap:3px}.team img{width:48px;height:48px}.team strong{font-size:12px}.meta{grid-template-columns:80px 1fr 70px}.meta b{font-size:10px}.time b{font-size:17px}.playoff-grid{grid-template-columns:1fr}}
</style></head><body><header><div class="container"><div class="top"><div class="brand"><img src="https://static.www.nfl.com/league/api/clubs/logos/MIA.svg" alt="Miami Dolphins Logo"><div><div class="title">MIAMI DOLPHINS</div><div class="subtitle">SEASON HUB</div></div></div><div class="season"><select id="seasonSelect" aria-label="Saison auswählen"><option value="2026">Saison 2026</option><option value="2025">Saison 2025</option><option value="2024">Saison 2024</option></select></div></div><nav class="nav"><a class="" href="index.html">📅 SPIELPLAN</a><a class="" href="tabelle.html">🏆 TABELLE</a><a class="active" href="playoffs.html">🏈 PLAYOFFS</a></nav></div></header><main class="container"><section class="summary"><h1>🏈 PLAYOFF PICTURE</h1><p><span id="yearTitle">2026</span> NFL Playoffs</p></section><section class="panel" style="margin-top:12px"><div id="playoffBox"><div class="loading">Lade Playoff Picture …</div></div></section></main><footer class="container">Private Miami Dolphins Season Hub · <span id="footerYear">2026</span></footer><script>
const LOGO_BASE='https://static.www.nfl.com/league/api/clubs/logos/';
const LOGOS={MIA:'MIA',BUF:'BUF',NE:'NE',NYJ:'NYJ',BAL:'BAL',CIN:'CIN',PIT:'PIT',HOU:'HOU',DEN:'DEN',KC:'KC',LAC:'LAC',JAX:'JAX',SEA:'SEA',SF:'SF',PHI:'PHI',GB:'GB',CHI:'CHI',DET:'DET',WAS:'WAS',TB:'TB',MIN:'MIN',LAR:'LAR',CAR:'CAR'};
const NAME={MIA:'Miami Dolphins',BUF:'Buffalo Bills',NE:'New England Patriots',NYJ:'New York Jets',BAL:'Baltimore Ravens',CIN:'Cincinnati Bengals',PIT:'Pittsburgh Steelers',HOU:'Houston Texans',DEN:'Denver Broncos',KC:'Kansas City Chiefs',LAC:'Los Angeles Chargers',JAX:'Jacksonville Jaguars',SEA:'Seattle Seahawks',SF:'San Francisco 49ers',PHI:'Philadelphia Eagles',GB:'Green Bay Packers',CHI:'Chicago Bears',DET:'Detroit Lions',WAS:'Washington Commanders',TB:'Tampa Bay Buccaneers',MIN:'Minnesota Vikings',LAR:'Los Angeles Rams',CAR:'Carolina Panthers'};
const DATA={
2024:{sb:'Super Bowl LIX',champ:'Philadelphia Eagles',afc:{wild:[['HOU','LAC',32,12,4,5],['BAL','PIT',28,14,3,6],['BUF','DEN',31,7,2,7]],div:[['KC','HOU',23,14,1,4],['BUF','BAL',27,25,2,3]],conf:[['KC','BUF',32,29,1,2]]},nfc:{wild:[['PHI','GB',22,10,2,7],['WAS','TB',23,20,6,3],['LAR','MIN',27,9,4,5]],div:[['WAS','DET',45,31,6,1],['PHI','LAR',28,22,2,4]],conf:[['PHI','WAS',55,23,2,6]]},sb:['PHI','KC',40,22]},
2025:{sb:'Super Bowl LX',champ:'Seattle Seahawks',afc:{wild:[['BUF','JAX',27,24,6,3],['NE','LAC',16,3,2,7],['HOU','PIT',30,6,5,4]],div:[['DEN','BUF',33,30,1,6],['NE','HOU',28,16,2,5]],conf:[['NE','DEN',10,7,2,1]]},nfc:{wild:[['LAR','CAR',34,31,5,4],['CHI','GB',31,27,2,7],['SF','PHI',23,19,6,3]],div:[['SEA','SF',41,6,1,6],['LAR','CHI',20,17,5,2]],conf:[['SEA','LAR',31,27,1,5]],},sb:['SEA','NE',29,13]},
2026:null
};
const params=new URLSearchParams(location.search);let SEASON=Number(params.get('season')||2026);if(![2024,2025,2026].includes(SEASON))SEASON=2026;
function logo(abbr){const code=abbr==='WAS'?'WAS':abbr;return `${LOGO_BASE}${code}.svg`;}
function team(abbr,seed,score,win){if(!abbr)return `<div class="btbd">TBD</div>`;return `<div class="bteam ${win?'winner':''}"><div class="bname"><img src="${logo(abbr)}" onerror="this.onerror=null;this.src='https://a.espncdn.com/i/teamlogos/nfl/500/${abbr.toLowerCase()}.png'" alt="${NAME[abbr]} Logo"><span>${seed?`<small>#${seed}</small>`:''}${NAME[abbr]}</span></div><b>${score??'—'}</b></div>`;}
function game(title,g){if(!g)return `<div class="card"><div class="ctitle">${title}</div>${team(null)}${team(null)}<div class="status">OFFEN</div></div>`;const [a,b,sa,sb,seeda,seedb]=g;return `<div class="card"><div class="ctitle">${title}</div>${team(a,seeda,sa,sa>sb)}${team(b,seedb,sb,sb>sa)}<div class="status">FINAL</div></div>`;}
function conf(name,d){return `<section class="conf"><h2>${name}</h2><div class="rounds"><div class="round"><h3>WILD CARD</h3>${d.wild.map((g,i)=>game('Spiel '+(i+1),g)).join('')}</div><div class="round"><h3>DIVISIONAL</h3>${d.div.map((g,i)=>game('Spiel '+(i+1),g)).join('')}</div><div class="round"><h3>CONFERENCE</h3>${d.conf.map(g=>game('Conference Championship',g)).join('')}</div></div></section>`;}
function openConf(name){return `<section class="conf"><h2>${name}</h2><div class="rounds"><div class="round"><h3>WILD CARD</h3>${[1,2,3].map(i=>game('Spiel '+i)).join('')}</div><div class="round"><h3>DIVISIONAL</h3>${[1,2].map(i=>game('Spiel '+i)).join('')}</div><div class="round"><h3>CONFERENCE</h3>${game('Conference Championship')}</div></div></section>`;}
function render(){const box=document.getElementById('playoffBox');const title=document.getElementById('yearTitle');const foot=document.getElementById('footerYear');title.textContent=SEASON;foot.textContent=SEASON;const sel=document.getElementById('seasonSelect');sel.value=String(SEASON);sel.addEventListener('change',()=>{const u=new URL(location.href);u.searchParams.set('season',sel.value);location.href=u.toString();});document.querySelectorAll('.nav a').forEach(a=>{const u=new URL(a.href,location.href);u.searchParams.set('season',SEASON);a.href=u.toString();});
if(SEASON===2026){box.innerHTML=`<div class="bracket-note"><b>🏈 Playoffs 2026</b><br>Die Playoff-Paarungen sind noch offen. Sobald die Regular Season abgeschlossen ist, werden die offiziellen Paarungen und Ergebnisse angezeigt.</div><div class="bracket-wrap">${openConf('AFC')}${openConf('NFC')}</div><div class="superbowl"><div class="super-title">🏆 SUPER BOWL LXI</div><div class="sb-match"><div>TBD</div><strong>vs.</strong><div>TBD</div></div><small>AFC Champion · NFC Champion</small></div>`;return;}
const d=DATA[SEASON];box.innerHTML=`<div class="bracket-note"><b>🏆 Playoffs ${SEASON}</b><br>Abgeschlossene Saison · alle Playoff-Ergebnisse stehen fest.</div><div class="bracket-wrap">${conf('AFC',d.afc)}${conf('NFC',d.nfc)}</div><div class="superbowl"><div class="super-title">🏆 ${d.sb==='Super Bowl LIX'?'SUPER BOWL LIX':'SUPER BOWL LX'}</div><div class="sb-match"><div><img src="${logo(d.sb[0])}" onerror="this.onerror=null;this.src='https://a.espncdn.com/i/teamlogos/nfl/500/${d.sb[0].toLowerCase()}.png'" alt="">${NAME[d.sb[0]]}<b>${d.sb[2]}</b></div><strong>vs.</strong><div><img src="${logo(d.sb[1])}" onerror="this.onerror=null;this.src='https://a.espncdn.com/i/teamlogos/nfl/500/${d.sb[1].toLowerCase()}.png'" alt="">${NAME[d.sb[1]]}<b>${d.sb[3]}</b></div></div><small>🏆 Champion: <b>${d.champ}</b></small></div>`;}
render();
</script></body></html>
